
name: DroidFPS Mod Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'droidfps-mod.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q droidfps-mod.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build mod
        run: |
          BUILD_FILE=$(find project -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "HATA: Gradle build dosyası bulunamadı!"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Proje klasörü: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DroidFPS-Mod
          path: project/**/build/libs/*.jar
          if-no-files-found: error
