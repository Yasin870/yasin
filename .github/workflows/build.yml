
name: DroidFPS Mod Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'droidfps-mod.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q droidfps-mod.zip -d project

      - name: Find and build Gradle project
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "HATA: ZIP içinde gradlew bulunamadı!"
            echo "ZIP içindeki dosyalar:"
            find project -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Gradle projesi bulundu: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DroidFPS-Mod
          path: project/**/build/libs/*.jar
          if-no-files-found: error
