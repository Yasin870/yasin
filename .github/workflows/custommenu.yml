name: CustomMenu Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge 1.20.1
        working-directory: CustomMenu/forge-1.20.1
        run: gradle build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: CustomMenu-Forge-1.20.1
          path: CustomMenu/forge-1.20.1/build/libs/*.jar
